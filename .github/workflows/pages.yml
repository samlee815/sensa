name: Redirect GitHub Pages to wearsensa.com

# The site now lives at https://wearsensa.com (Cloudflare). This keeps any old
# samlee815.github.io/sensa links working by sending them to the same path there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Sensa has moved</title>
          <meta name="robots" content="noindex" />
          <link rel="canonical" href="https://wearsensa.com/" />
          <meta http-equiv="refresh" content="0; url=https://wearsensa.com/" />
          <script>location.replace("https://wearsensa.com" + location.pathname.replace(/^\/sensa/, "") + location.search + location.hash);</script>
          <p>Sensa has moved to <a href="https://wearsensa.com/">wearsensa.com</a>.</p>
          HTML
          cp site/index.html site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
